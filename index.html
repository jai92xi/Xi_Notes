<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — simple notes worth sharing."
  >

  <title>AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Markdown parser -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    defer
  ></script>
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header>

    <a
      href="./"
      class="brand"
      aria-label="AI & ML Key Concepts home"
    >
      <span>✦</span>
      <span>AI & ML Key Concepts</span>
    </a>


    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        ☰
      </button>


      <button
        id="theme-button"
        class="theme-button"
        type="button"
        aria-label="Switch to dark theme"
        title="Switch to dark theme"
      >
        ☾
      </button>

    </div>

  </header>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <div class="app">


    <!-- ===================================================
         SIDEBAR / CONTENTS
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Contents"
    >

      <!-- Three-line contents toggle -->

      <button
        id="contents-toggle"
        class="contents-toggle"
        type="button"
        aria-label="Hide contents"
        title="Hide contents"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- Sidebar header -->

      <div class="sidebar-header">

        <div class="sidebar-title">
          CONTENTS ✦
        </div>


        <!-- Search -->

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="Search concepts..."
          autocomplete="off"
          aria-label="Search concepts"
        >

      </div>


      <!-- Notes -->

      <nav
        class="topic-navigation"
        aria-label="Note navigation"
      >

        <!-- Topics are generated by app.js -->

      </nav>


      <!-- Sidebar footer -->

      <div class="sidebar-footer">
        Made with ♥ &amp; curiosity
      </div>

    </aside>


    <!-- ===================================================
         MOBILE OVERLAY
         =================================================== -->

    <div
      id="sidebar-overlay"
      class="sidebar-overlay"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main id="main">


      <!-- =================================================
           TOP PREVIOUS / NEXT NAVIGATION
           ================================================= -->

      <nav
        class="page-navigation"
        aria-label="Previous and next note"
      >

        <!-- Generated by app.js -->

      </nav>


      <!-- =================================================
           CONTENT
           ================================================= -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

            <div class="loading-line"></div>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>
</html>
