<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — practical notes and learnings about artificial intelligence, machine learning, deep learning, LLMs, and more."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>AI &amp; ML Key Concepts</title>


  <!-- =====================================================
       FONT
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =====================================================
       MARKDOWN RENDERER
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    defer
  ></script>

</head>


<body>

  <div class="app">

    <div class="layout">


      <!-- =================================================
           NOTES SIDEBAR
           ================================================= -->

      <aside
        id="sidebar"
        aria-label="AI and ML notes"
      >

        <div class="sidebar-header">


          <!-- Mobile close -->

          <button
            id="close-sidebar"
            type="button"
            aria-label="Close notes"
            title="Close notes"
          >
            ×
          </button>


          <!-- Site title -->

          <h1 class="sidebar-title">
            AI &amp; ML Key Concepts
          </h1>


          <!-- Search -->

          <div class="search-container">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              ⌕
            </span>


            <input
              id="search"
              type="search"
              placeholder="Search concepts..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search AI and ML concepts"
            >

          </div>

        </div>


        <!-- =================================================
             NOTES LIST

             app.js automatically fills this section
             from the /notes folder.

             .md is NOT displayed.
             Underscores are NOT displayed.
             Names are formatted by app.js.
             ================================================= -->

        <nav
          class="topic-navigation"
          aria-label="AI and ML key concepts"
        >

          <div class="no-results">
            Loading concepts...
          </div>

        </nav>

      </aside>


      <!-- =================================================
           MOBILE SIDEBAR OVERLAY
           ================================================= -->

      <div
        id="sidebar-overlay"
        aria-hidden="true"
      ></div>


      <!-- =================================================
           MAIN
           ================================================= -->

      <main>


        <!-- =================================================
             FROZEN TOP NAVIGATION

             This is the ONLY Previous / Next navigation.
             ================================================= -->

        <header
          class="top-bar"
          aria-label="Note navigation"
        >


          <!-- Mobile menu -->

          <button
            id="menu-button"
            type="button"
            aria-label="Open notes"
            title="Open notes"
          >
            ☰
          </button>


          <!-- =================================================
               PREVIOUS / NEXT

               app.js updates these buttons based on the
               currently selected note.
               ================================================= -->

          <nav
            class="page-navigation"
            aria-label="Previous and next note"
          >

            <button
              id="previous-note"
              type="button"
              class="page-nav-button previous-page"
              disabled
              aria-label="Previous note"
            >

              <span
                class="page-nav-arrow"
                aria-hidden="true"
              >
                ←
              </span>


              <span class="page-nav-copy">

                <span class="page-nav-label">
                  Previous
                </span>

                <span class="page-nav-title">
                  —
                </span>

              </span>

            </button>


            <button
              id="next-note"
              type="button"
              class="page-nav-button next-page"
              disabled
              aria-label="Next note"
            >

              <span class="page-nav-copy">

                <span class="page-nav-label">
                  Next
                </span>

                <span class="page-nav-title">
                  —
                </span>

              </span>


              <span
                class="page-nav-arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>

          </nav>


          <!-- =================================================
               THEME TOGGLE

               Light theme is the default.
               ================================================= -->

          <button
            id="theme-button"
            type="button"
            aria-label="Switch to dark theme"
            title="Switch to dark theme"
          >
            ☾
          </button>

        </header>


        <!-- =================================================
             NOTE CONTENT

             app.js loads and renders Markdown here.

             There is intentionally NO second
             Previous / Next navigation here.
             ================================================= -->

        <article
          id="content"
          aria-live="polite"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

            <div class="loading-line"></div>

          </div>

        </article>


      </main>

    </div>


    <!-- =====================================================
         NOTES BUTTON

         Kept as a simple way to access the notes on mobile.
         The sidebar itself does NOT auto-collapse.
         ===================================================== -->

    <button
      id="notes-toggle"
      type="button"
      aria-label="Open notes list"
      title="Open notes list"
    >
      ☰ Notes
    </button>

  </div>


  <!-- =======================================================
       APPLICATION
       ======================================================= -->

  <script
    src="app.js"
    defer
  ></script>

</body>
</html>
