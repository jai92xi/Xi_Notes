<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Xi Notes — personal notes and knowledge."
  >

  <title>Xi Notes</title>

  <link rel="stylesheet" href="style.css">

  <!-- Markdown parser -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>
</head>

<body>

  <div class="app">

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <a
          href="#"
          class="logo"
          onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;"
        >
          Xi Notes
        </a>

        <button
          id="close-sidebar"
          class="close-sidebar"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>


      <!-- SEARCH -->

      <div class="search-container">

        <div class="search-box">

          <span class="search-icon">
            /
          </span>

          <input
            id="search"
            type="search"
            placeholder="Search notes"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search notes"
          >

          <span class="search-shortcut">
            ⌘K
          </span>

        </div>

      </div>


      <!-- TOPIC LIST -->

      <nav
        class="topic-navigation"
        aria-label="Notes"
      >
        <!-- app.js dynamically inserts .md files here -->
      </nav>


      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">
        <span>Personal notes</span>
      </div>

    </aside>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main">


      <!-- TOP NAVIGATION -->

      <header class="topbar">

        <button
          id="menu-button"
          class="menu-button"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <div class="breadcrumb">

          <span class="breadcrumb-home">
            Xi Notes
          </span>

          <span class="breadcrumb-separator">
            /
          </span>

          <span
            id="current-topic"
            class="current-topic"
          >
            Notes
          </span>

        </div>


        <!-- DARK / LIGHT TOGGLE -->

        <button
          id="theme-button"
          class="theme-button"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          ☾
        </button>

      </header>


      <!-- =====================================
           NOTE CONTENT
      ====================================== -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="welcome">

            <p class="welcome-label">
              NOTES
            </p>

            <h1>
              Xi Notes
            </h1>

            <p class="welcome-description">
              A collection of notes, ideas,
              concepts and things worth remembering.
            </p>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================
       MOBILE OVERLAY
  ====================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
  ></div>


  <!-- =====================================
       APPLICATION
  ====================================== -->

  <script src="app.js"></script>


  <!-- =====================================
       THEME
  ====================================== -->

  <script>

    const themeButton =
      document.getElementById("theme-button");


    function updateThemeIcon() {

      const isLight =
        document.body.classList.contains(
          "light-theme"
        );

      themeButton.textContent =
        isLight ? "☾" : "☀";

      themeButton.setAttribute(
        "aria-label",
        isLight
          ? "Switch to dark mode"
          : "Switch to light mode"
      );

    }


    /*
      Load saved theme.
    */

    const savedTheme =
      localStorage.getItem(
        "xi-notes-theme"
      );


    if (savedTheme === "light") {

      document.body.classList.add(
        "light-theme"
      );

    }


    updateThemeIcon();


    /*
      Toggle theme.
    */

    themeButton.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "light-theme"
        );

        const isLight =
          document.body.classList.contains(
            "light-theme"
          );

        localStorage.setItem(
          "xi-notes-theme",
          isLight
            ? "light"
            : "dark"
        );

        updateThemeIcon();

      }
    );

  </script>

</body>
</html>
