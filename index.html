
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#f8f7ff"
  />

  <meta
    name="description"
    content="Xi Notes — your personal AI, Machine Learning, Data Engineering, and technical interview revision space."
  />

  <title>Xi Notes — Learn. Revise. Repeat.</title>

  <link rel="icon" href="./favicon.ico" />

  <!-- Modern, readable typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- KaTeX styles for mathematical formulas -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  />

  <!-- Main application styles -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Default theme and small accessibility improvements -->
  <style>
    :root {
      color-scheme: light;
      --xi-page-bg: #f8f7ff;
      --xi-text: #24213a;
      --xi-accent: #8b78f9;
      --xi-highlight: #fff09b;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--xi-page-bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--xi-page-bg);
      color: var(--xi-text);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(139, 120, 249, 0.55);
      outline-offset: 3px;
    }

    ::selection {
      color: #24213a;
      background: #fff09b;
    }

    mark,
    .xi-highlight {
      padding: 0.08em 0.22em;
      border-radius: 0.2em;
      background: #fff09b;
      color: #29243d;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .xi-app-loading {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .xi-app-loading-inner {
      max-width: 360px;
      text-align: center;
    }

    .xi-app-loading-logo {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 19px;
      background: #eae5ff;
      color: #6d56dc;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(139, 120, 249, 0.12);
    }

    .xi-app-loading h1 {
      margin: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 23px;
      letter-spacing: -0.8px;
    }

    .xi-app-loading p {
      margin: 9px 0 0;
      color: #858198;
      font-size: 14px;
    }

    .xi-app-loading-spinner {
      width: 25px;
      height: 25px;
      margin: 22px auto 0;
      border: 3px solid #e8e3ff;
      border-top-color: #8b78f9;
      border-radius: 50%;
      animation: xi-spin 0.8s linear infinite;
    }

    @keyframes xi-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="xi-app-loading">
      <div class="xi-app-loading-inner">
        <div class="xi-app-loading-logo">Xi</div>
        <h1>Xi Notes</h1>
        <p>Preparing your revision space...</p>
        <div
          class="xi-app-loading-spinner"
          role="status"
          aria-label="Loading application"
        ></div>
      </div>
    </div>
  </div>

  <!--
    app.js replaces the initial loading screen with the full application.
    It loads Markdown, DOMPurify, and KaTeX as required.
  -->
  <script src="./app.js" defer></script>
</body>
</html>
