<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="AI & ML notes, experiments, ideas and things worth remembering."
  >

  <title>AI Curiosity Lab</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <a
          href="#"
          class="logo"
          onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;"
        >
          AI Curiosity Lab
        </a>

        <button
          id="close-sidebar"
          class="close-sidebar"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>

      <!-- SEARCH -->
      <div class="search-container">

        <div class="search-box">

          <span class="search-icon">⌕</span>

          <input
            id="search"
            type="search"
            placeholder="Search notes"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search notes"
          >

          <span class="search-shortcut">⌘K</span>

        </div>

      </div>

      <!-- NOTES -->
      <nav
        class="topic-navigation"
        aria-label="Notes"
      ></nav>

      <!-- FOOTER -->
      <div class="sidebar-footer">
        Made with ❤️ & curiosity
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- STICKY TOP BAR -->
      <header class="topbar">

        <button
          id="menu-button"
          class="menu-button"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <div class="topbar-brand">
          <span class="brand-mark">✦</span>
          <span>AI Curiosity Lab</span>
        </div>


        <!-- THEME -->
        <button
          id="theme-button"
          class="theme-button"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          ☾
        </button>

      </header>


      <!-- CONTENT -->
      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="welcome">

            <p class="welcome-label">
              CURRENTLY EXPLORING
            </p>

            <h1>
              Always learning.
            </h1>

            <p class="welcome-description">
              AI, machine learning, systems, experiments,
              ideas and the occasional rabbit hole.
            </p>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- MOBILE OVERLAY -->
  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
  ></div>


  <script src="app.js"></script>

</body>
</html>
