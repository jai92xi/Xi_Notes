<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — shared notes on artificial intelligence and machine learning."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>AI & ML Key Concepts</title>

  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       MARKDOWN
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       STYLES
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================================================
       MOBILE OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
  ></div>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">


    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="sidebar-inner">


        <!-- ===============================================
             SIDEBAR HEADER
             =============================================== -->

        <div class="sidebar-header">

          <div class="brand">

            <div class="brand-mark">
              ✦
            </div>

            <div class="brand-copy">

              <div class="brand-title">
                AI & ML Key Concepts
              </div>

              <div class="brand-subtitle">
                Notes worth sharing
              </div>

            </div>

          </div>


          <button
            id="close-sidebar"
            class="close-sidebar"
            type="button"
            aria-label="Close navigation"
          >
            ×
          </button>

        </div>


        <!-- ===============================================
             SEARCH
             =============================================== -->

        <div class="search-wrapper">

          <div class="search-box">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              ⌕
            </span>

            <input
              id="search"
              type="search"
              placeholder="Search concepts..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search concepts"
            >

            <span class="search-shortcut">
              ⌘ K
            </span>

          </div>

        </div>


        <!-- ===============================================
             TABLE OF CONTENTS
             =============================================== -->

        <div class="contents-header">

          <span>
            CONTENTS
          </span>

          <span class="contents-spark">
            ✦
          </span>

        </div>


        <nav
          class="topic-navigation"
          aria-label="AI and ML notes"
        >

          <div class="no-results">
            Loading concepts...
          </div>

        </nav>


        <!-- ===============================================
             SIDEBAR FOOTER
             =============================================== -->

        <div class="sidebar-footer">

          <span>
            Made with
            <span class="heart">♥</span>
            & curiosity
          </span>

        </div>

      </div>

    </aside>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main class="main">


      <!-- =================================================
           FIXED TOP NAVIGATION
           ================================================= -->

      <header class="top-bar">


        <!-- ===============================================
             MOBILE MENU
             =============================================== -->

        <button
          id="menu-button"
          class="menu-button"
          type="button"
          aria-label="Open navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>


        <!-- ===============================================
             PREVIOUS / NEXT
             =============================================== -->

        <div
          class="page-navigation"
          aria-label="Note navigation"
        >
          <!-- Populated by app.js -->
        </div>


        <!-- ===============================================
             THEME BUTTON
             =============================================== -->

        <button
          id="theme-button"
          class="theme-button"
          type="button"
          aria-label="Switch to dark theme"
          title="Switch to dark theme"
        >
          ☾
        </button>

      </header>


      <!-- =================================================
           CONTENT AREA
           ================================================= -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

            <div class="loading-line"></div>

          </div>

        </article>

      </div>


    </main>

  </div>


  <!-- =====================================================
       APP SCRIPT
       ===================================================== -->

  <script
    src="app.js"
  ></script>

</body>
</html>
