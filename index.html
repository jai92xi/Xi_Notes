<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI and Machine Learning revision notes by Xi."
  >

  <title>Xi Notes — AI & ML</title>

  <link rel="stylesheet" href="style.css">

  <!-- MathJax for LaTeX formulas -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["\\[", "\\]"],
          ["$$", "$$"]
        ]
      },
      options: {
        skipHtmlTags: [
          "script",
          "noscript",
          "style",
          "textarea",
          "pre",
          "code"
        ]
      }
    };
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    async
  ></script>

</head>


<body>

  <!-- =====================================
       SIDEBAR
  ====================================== -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <a
        href="https://github.com/jai92xi/Xi_Notes"
        target="_blank"
        rel="noopener noreferrer"
        class="logo"
      >
        Xi Notes
      </a>

      <span class="subtitle">
        AI & ML Revision
      </span>

    </div>


    <!-- Search box is inserted here by app.js -->


    <div class="contents-title">
      CONTENTS
    </div>


    <nav
      id="contentsList"
      class="contents-list"
      aria-label="Notes"
    >
      <!-- Topics loaded by app.js -->
    </nav>

  </aside>


  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="main">


    <!-- ===================================
         FIXED TOP BAR
    ==================================== -->

    <header class="topbar">

      <button
        id="previousBtn"
        class="topic-button previous"
        type="button"
        title="Previous topic"
      >
        ← Previous
      </button>


      <div class="topbar-title">
        Xi Notes
      </div>


      <div class="topbar-right">

        <button
          id="nextBtn"
          class="topic-button next"
          type="button"
          title="Next topic"
        >
          Next →
        </button>


        <button
          id="themeToggle"
          class="theme-button"
          type="button"
          aria-label="Switch theme"
          title="Switch theme"
        >
          ☾
        </button>

      </div>

    </header>


    <!-- ===================================
         NOTE
    ==================================== -->

    <article class="note">


      <div
        id="loading"
        class="loading"
      >
        Loading notes...
      </div>


      <div
        id="errorMessage"
        class="error-message"
        role="alert"
      ></div>


      <!-- Note title only -->
      <header class="note-header">

        <h1 id="noteTitle">
          Select a topic
        </h1>

      </header>


      <!-- Actual notebook content -->

      <section
        id="noteContent"
        class="note-content"
      >
        <!-- Markdown rendered here -->
      </section>


    </article>


    <!-- ===================================
         FOOTER
    ==================================== -->

    <footer class="footer">

      <span>
        Xi Notes
      </span>

      <a
        href="https://github.com/jai92xi/Xi_Notes/tree/main/notes"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>

    </footer>


  </main>


  <!-- =====================================
       APP JS
  ====================================== -->

  <script src="app.js"></script>

</body>

</html>
