<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — concise notes on artificial intelligence and machine learning."
  >

  <title>AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header>
    <div class="header-spacer"></div>

    <div class="header-actions">

      <!-- Mobile menu -->
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        ☰
      </button>

    </div>
  </header>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">

    <!-- Sidebar overlay for mobile -->
    <div
      id="sidebar-overlay"
      class="sidebar-overlay"
    ></div>


    <!-- ===================================================
         SIDEBAR / CONTENTS
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Notes navigation"
    >

      <!-- Three-line contents toggle -->
      <button
        id="contents-toggle"
        class="contents-toggle"
        type="button"
        aria-label="Toggle contents"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- Search -->
      <div class="sidebar-header">

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="⌕  Search concepts..."
          aria-label="Search concepts"
          autocomplete="off"
        >

      </div>


      <!-- Notes list -->
      <nav
        id="topic-navigation"
        class="topic-navigation"
        aria-label="AI and ML concepts"
      >
        <!-- app.js populates this -->
      </nav>


      <!-- Footer -->
      <div class="sidebar-footer">
        <span>Made with</span>
        <span class="footer-love">♥</span>
        <span>&</span>
        <span>curiosity</span>
      </div>

    </aside>


    <!-- ===================================================
         MAIN CONTENT
         =================================================== -->

    <main id="main">

      <!-- =================================================
           PREVIOUS / NEXT NAVIGATION
           ================================================= -->

      <nav
        id="page-navigation"
        class="page-navigation"
        aria-label="Post navigation"
      >

        <!-- Previous -->
        <button
          id="previous-button"
          class="page-nav-button previous-page"
          type="button"
        >

          <span
            class="page-nav-arrow"
            aria-hidden="true"
          >
            ←
          </span>

          <span class="page-nav-copy">

            <span class="page-nav-label">
              Previous
            </span>

            <span
              id="previous-title"
              class="page-nav-title"
            >
              —
            </span>

          </span>

        </button>


        <!-- Next -->
        <button
          id="next-button"
          class="page-nav-button next-page"
          type="button"
        >

          <span class="page-nav-copy">

            <span class="page-nav-label">
              Next
            </span>

            <span
              id="next-title"
              class="page-nav-title"
            >
              —
            </span>

          </span>

          <span
            class="page-nav-arrow"
            aria-hidden="true"
          >
            →
          </span>

        </button>

      </nav>


      <!-- =================================================
           NOTE CONTENT
           ================================================= -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="loading">

            <div class="loading-line"></div>
            <div class="loading-line"></div>
            <div class="loading-line short"></div>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================================
       FLOATING THEME BUTTON
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch theme"
    title="Switch theme"
  >
    ☾
  </button>


  <!-- =====================================================
       APP JAVASCRIPT
       ===================================================== -->

  <script src="app.js"></script>

</body>
</html>
