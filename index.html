<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="A personal collection of AI and machine learning notes."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>AI & ML Notes</title>

  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================================
       STYLES
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================================================
       MOBILE SIDEBAR OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <div class="header-left">

      <button
        id="menu-button"
        class="icon-button mobile-menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        <span aria-hidden="true">☰</span>
      </button>

      <a
        href="./"
        class="site-title"
        aria-label="AI and ML Notes home"
      >
        AI & ML Notes
      </a>

    </div>


    <div class="header-actions">

      <button
        id="theme-button"
        class="icon-button"
        type="button"
        aria-label="Switch to dark theme"
        title="Switch to dark theme"
      >
        ☾
      </button>

    </div>

  </header>


  <!-- =====================================================
       PAGE LAYOUT
       ===================================================== -->

  <div class="page-layout">


    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Notes navigation"
    >

      <div class="sidebar-header">

        <div class="sidebar-heading">

          <span class="sidebar-heading-mark">
            ✦
          </span>

          <span>
            Contents
          </span>

        </div>


        <button
          id="contents-toggle"
          class="icon-button contents-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Hide contents"
          title="Hide contents"
        >
          ‹
        </button>


        <button
          id="close-sidebar"
          class="icon-button close-sidebar-button"
          type="button"
          aria-label="Close contents"
          title="Close contents"
        >
          ×
        </button>

      </div>


      <!-- =================================================
           SEARCH
           ================================================= -->

      <div class="search-wrapper">

        <label
          class="search-box"
          for="search"
        >

          <span
            class="search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            id="search"
            type="search"
            placeholder="Search notes..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Search notes"
          >

          <kbd>
            Ctrl K
          </kbd>

        </label>

      </div>


      <!-- =================================================
           TOPIC NAVIGATION
           ================================================= -->

      <nav
        id="topic-navigation"
        class="topic-navigation"
        aria-label="Notes"
      >

        <div class="no-results">
          Loading concepts...
        </div>

      </nav>


      <!-- =================================================
           SIDEBAR FOOTER
           ================================================= -->

      <div class="sidebar-footer">

        <span>
          Personal knowledge base
        </span>

      </div>

    </aside>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main
      id="main"
      class="main"
    >

      <article
        id="content"
        class="content"
      >

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>


      <!-- =================================================
           PREVIOUS / NEXT
           ================================================= -->

      <nav
        class="topic-pagination"
        aria-label="Note navigation"
      >

        <button
          id="previous-button"
          class="pagination-button pagination-previous"
          type="button"
          disabled
        >

          <span
            class="pagination-arrow"
            aria-hidden="true"
          >
            ←
          </span>

          <span class="pagination-copy">

            <span class="pagination-label">
              Previous
            </span>

            <span
              id="previous-title"
              class="pagination-title"
            ></span>

          </span>

        </button>


        <button
          id="next-button"
          class="pagination-button pagination-next"
          type="button"
          disabled
        >

          <span class="pagination-copy">

            <span class="pagination-label">
              Next
            </span>

            <span
              id="next-title"
              class="pagination-title"
            ></span>

          </span>

          <span
            class="pagination-arrow"
            aria-hidden="true"
          >
            →
          </span>

        </button>

      </nav>

    </main>

  </div>


  <!-- =====================================================
       MARKDOWN PARSER
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <script
    src="app.js"
  ></script>

</body>
</html>
