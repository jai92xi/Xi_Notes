<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — concise notes on artificial intelligence and machine learning."
  >

  <title>AI & ML Key Concepts</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Syntax highlighting -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header>

    <div class="header-spacer"></div>

    <div class="header-actions">

      <!-- Mobile menu -->
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">

    <!-- Mobile sidebar overlay -->
    <div
      id="sidebar-overlay"
      class="sidebar-overlay"
    ></div>


    <!-- ===================================================
         SIDEBAR / CONTENTS
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Notes navigation"
    >

      <!-- Three-line contents toggle -->
      <button
        id="contents-toggle"
        class="contents-toggle"
        type="button"
        aria-label="Hide contents"
        aria-controls="sidebar"
        aria-expanded="true"
        title="Hide contents"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- Search -->
      <div class="sidebar-header">

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="⌕  Search concepts..."
          aria-label="Search concepts"
          autocomplete="off"
        >

      </div>


      <!-- =================================================
           NOTES LIST

           app.js automatically loads the actual filenames
           from the GitHub notes/ directory.

           Example:

           Early_Stopping.md
           ->
           Early Stopping

           batch-normalization.md
           ->
           Batch Normalization
           ================================================= -->

      <nav
        id="topic-navigation"
        class="topic-navigation"
        aria-label="AI and ML concepts"
      >
        <div class="no-results">
          Loading concepts...
        </div>
      </nav>


      <!-- Footer -->
      <div class="sidebar-footer">

        <span>Made with</span>

        <span
          class="footer-love"
          aria-hidden="true"
        >
          ♥
        </span>

        <span>&amp;</span>

        <span>curiosity</span>

      </div>

    </aside>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main id="main">


      <!-- =================================================
           PREVIOUS / NEXT NAVIGATION

           This is the ONLY previous/next navigation.
           There is intentionally no bottom navigation.
           ================================================= -->

      <nav
        id="page-navigation"
        class="page-navigation"
        aria-label="Post navigation"
      >

        <!-- app.js populates Previous / Next -->
        <button
          class="page-nav-button previous-page"
          type="button"
          disabled
        >

          <span
            class="page-nav-arrow"
            aria-hidden="true"
          >
            ←
          </span>

          <span class="page-nav-copy">

            <span class="page-nav-label">
              Previous
            </span>

            <span class="page-nav-title">
              —
            </span>

          </span>

        </button>


        <button
          class="page-nav-button next-page"
          type="button"
          disabled
        >

          <span class="page-nav-copy">

            <span class="page-nav-label">
              Next
            </span>

            <span class="page-nav-title">
              —
            </span>

          </span>

          <span
            class="page-nav-arrow"
            aria-hidden="true"
          >
            →
          </span>

        </button>

      </nav>


      <!-- =================================================
           NOTE CONTENT
           ================================================= -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
          aria-live="polite"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================================
       FLOATING THEME BUTTON
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >
    ☾
  </button>


  <!-- =====================================================
       APP JAVASCRIPT
       ===================================================== -->

  <script src="app.js"></script>


  <!-- =====================================================
       HIGHLIGHT.JS
       ===================================================== -->

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      () => {

        if (
          typeof hljs !== "undefined"
        ) {

          hljs.configure({
            languages: [
              "javascript",
              "python",
              "bash",
              "json",
              "yaml",
              "html",
              "css",
              "sql"
            ]
          });

        }

      }
    );
  </script>

</body>
</html>
