<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — simple notes worth sharing."
  >

  <title>AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    defer
  ></script>
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header>

    <div class="header-spacer"></div>

    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        ☰
      </button>

      <button
        id="theme-button"
        class="theme-button"
        type="button"
        aria-label="Switch to dark theme"
        title="Switch to dark theme"
      >
        ☾
      </button>

    </div>

  </header>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">


    <!-- ===================================================
         SIDEBAR / CONTENTS
         =================================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Contents"
    >

      <!-- Three-line contents toggle -->

      <button
        id="contents-toggle"
        class="contents-toggle"
        type="button"
        aria-label="Hide contents"
        title="Hide contents"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- Search -->

      <div class="sidebar-header">

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="Search concepts..."
          autocomplete="off"
          aria-label="Search concepts"
        >

      </div>


      <!-- Notes -->

      <nav
        class="topic-navigation"
        aria-label="Note navigation"
      >
        <!-- Topics generated by app.js -->
      </nav>


      <!-- Footer -->

      <div class="sidebar-footer">

        <span>🧠</span>
        <span>☕</span>
        <span>✨</span>
        <span>Made with</span>
        <span class="footer-love">♥</span>
        <span>&amp;</span>
        <span>curiosity</span>
        <span>🚀</span>

      </div>

    </aside>


    <!-- ===================================================
         MOBILE OVERLAY
         =================================================== -->

    <div
      id="sidebar-overlay"
      class="sidebar-overlay"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         MAIN
         =================================================== -->

    <main id="main">


      <!-- =================================================
           PREVIOUS / NEXT NAVIGATION

           This is the ONLY navigation between notes.
           ================================================= -->

      <nav
        class="page-navigation"
        aria-label="Previous and next note"
      >
        <!-- Generated by app.js -->
      </nav>


      <!-- =================================================
           CONTENT
           ================================================= -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

            <div class="loading-line"></div>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================================
       APP SCRIPT
       ===================================================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>
</html>
