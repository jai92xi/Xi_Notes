
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A clean, searchable technical interview revision workspace."
  >
  <meta name="theme-color" content="#f1f4ef">

  <title>Revision Notes</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Markdown math and code highlighting styles are loaded by app.js -->

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #f1f4ef;
      color: #25332d;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #b4cbb8;
      outline-offset: 2px;
    }

    ::selection {
      background: #dce9da;
      color: #25332d;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="./app.js" defer></script>
</body>
</html>
