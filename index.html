<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI and Machine Learning revision notes by Xi."
  >

  <title>Xi Notes — AI & ML</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- ================================
       LEFT SIDEBAR
  ================================== -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <a
        href="https://github.com/jai92xi/Xi_Notes"
        target="_blank"
        rel="noopener noreferrer"
        class="logo"
      >
        Xi Notes
      </a>

      <span class="subtitle">
        AI & ML Revision
      </span>

    </div>


    <div class="contents-title">
      CONTENTS
    </div>


    <nav
      id="contentsList"
      class="contents-list"
      aria-label="Notes"
    >
      <!-- Topics are loaded by app.js -->
    </nav>

  </aside>


  <!-- ================================
       MAIN CONTENT
  ================================= -->

  <main class="main">


    <!-- ==============================
         FIXED TOP NAVIGATION
    =============================== -->

    <header class="topbar">

      <button
        id="previousBtn"
        class="topic-button previous"
        type="button"
      >
        ← Previous
      </button>


      <div class="topbar-title">
        AI & ML Notes
      </div>


      <div class="topbar-right">

        <button
          id="nextBtn"
          class="topic-button next"
          type="button"
        >
          Next →
        </button>


        <button
          id="themeToggle"
          class="theme-button"
          type="button"
          aria-label="Switch theme"
        >
          ☾
        </button>

      </div>

    </header>


    <!-- ==============================
         NOTE
    =============================== -->

    <article class="note">


      <!-- Loading -->

      <div
        id="loading"
        class="loading"
      >
        Loading notes...
      </div>


      <!-- Error -->

      <div
        id="errorMessage"
        class="error-message"
        role="alert"
      ></div>


      <!-- Note Header -->

      <header class="note-header">

        <div class="note-label">
          AI / ML REVISION
        </div>

        <h1 id="noteTitle">
          Select a topic
        </h1>

      </header>


      <!-- Markdown Content -->

      <section
        id="noteContent"
        class="note-content"
      >
        <!-- Selected Markdown notebook appears here -->
      </section>


    </article>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="footer">

      <span>
        Xi Notes
      </span>

      <a
        href="https://github.com/jai92xi/Xi_Notes/tree/main/notes"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>

    </footer>


  </main>


  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script src="app.js"></script>

</body>

</html>
