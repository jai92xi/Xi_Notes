<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI and ML personal knowledge base"
  >

  <title>🧠 AI & ML Key Concepts</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       MOBILE HEADER
       ===================================================== -->

  <header class="mobile-header">

    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <aside
    id="sidebar"
    class="sidebar"
    aria-label="Notes navigation"
  >

    <!-- Sidebar header / search -->
    <div class="sidebar-header">

      <div
        class="contents-search-box"
        id="contents-search-box"
      >

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="Search concepts..."
          autocomplete="off"
          aria-label="Search concepts"
        >

        <!--
          Expanded:
          3 horizontal lines = hide contents

          Collapsed:
          chevron = show contents

          app.js switches the .collapsed class.
        -->

        <button
          id="contents-toggle"
          class="contents-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Hide contents"
          title="Hide contents"
        >

          <span></span>
          <span></span>
          <span></span>

        </button>

      </div>

    </div>


    <!-- ===================================================
         TOPIC NAVIGATION
         =================================================== -->

    <nav
      id="topic-navigation"
      class="topic-navigation"
      aria-label="AI and ML concepts"
    >
      <!-- Populated by app.js -->
    </nav>


    <!-- ===================================================
         SIDEBAR FOOTER
         =================================================== -->

    <div class="sidebar-footer">

      Personal knowledge base

      <span class="footer-love">
        ♥
      </span>

      for learning AI & ML

    </div>

  </aside>


  <!-- =====================================================
       MOBILE SIDEBAR OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <!-- ===================================================
         TOP FIXED NAVIGATION
         =================================================== -->

    <nav
      class="page-navigation"
      aria-label="Note navigation"
    >

      <button
        id="previous-button"
        class="page-nav-button previous-page"
        type="button"
        disabled
        aria-label="Previous note"
      >

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          ←
        </span>

        <span
          id="previous-title"
          class="page-nav-title"
        >
          Start
        </span>

      </button>


      <button
        id="next-button"
        class="page-nav-button next-page"
        type="button"
        disabled
        aria-label="Next note"
      >

        <span
          id="next-title"
          class="page-nav-title"
        >
          Next
        </span>

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </button>

    </nav>


    <!-- ===================================================
         CONTENT WRAPPER
         =================================================== -->

    <div class="content-wrapper">

      <!--
        Curved bordered content container.
        Markdown from the selected note is injected here
        by app.js.
      -->

      <article
        id="content"
        class="content"
      >

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>

    </div>

  </main>


  <!-- =====================================================
       FLOATING THEME SWITCH
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >

    <span
      class="theme-icon"
      aria-hidden="true"
    >
      ☾
    </span>

  </button>


  <!-- =====================================================
       MARKED.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <script
    src="app.js"
  ></script>

</body>
</html>
