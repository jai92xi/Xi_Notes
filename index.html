<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Shared AI Notes — practical notes and learnings about AI, machine learning, deep learning, LLMs, and more."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Shared AI Notes</title>

  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLES
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =====================================================
       MARKED.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    defer
  ></script>

</head>


<body>

  <div class="app">

    <div class="layout">


      <!-- =================================================
           SIDEBAR
           ================================================= -->

      <aside
        id="sidebar"
        aria-label="Notes navigation"
      >

        <div class="sidebar-header">

          <button
            id="close-sidebar"
            type="button"
            aria-label="Close notes"
          >
            ×
          </button>


          <h2 class="sidebar-title">
            Shared AI Notes
          </h2>


          <p class="sidebar-subtitle">
            Notes worth sharing ✦
          </p>


          <!-- Search -->

          <div class="search-container">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              ⌕
            </span>


            <input
              id="search"
              type="search"
              placeholder="Search notes..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search notes"
            >

          </div>

        </div>


        <!-- =================================================
             TOPIC LIST
             ================================================= -->

        <nav
          class="topic-navigation"
          aria-label="Available notes"
        >

          <div class="no-results">
            Loading notes...
          </div>

        </nav>

      </aside>


      <!-- =================================================
           SIDEBAR OVERLAY
           ================================================= -->

      <div
        id="sidebar-overlay"
        aria-hidden="true"
      ></div>


      <!-- =================================================
           MAIN CONTENT
           ================================================= -->

      <main>


        <!-- =================================================
             FROZEN TOP BAR
             ================================================= -->

        <header
          class="top-bar"
          aria-label="Note navigation"
        >


          <!-- Mobile menu -->

          <button
            id="menu-button"
            type="button"
            aria-label="Open notes"
            title="Open notes"
          >
            ☰
          </button>


          <!-- =================================================
               TOP PREVIOUS / NEXT NAVIGATION

               app.js replaces this content with the
               current Previous / Next buttons.
               ================================================= -->

          <nav
            class="page-navigation"
            aria-label="Note navigation"
          >

            <button
              type="button"
              class="page-nav-button previous-page"
              disabled
            >

              <span class="page-nav-arrow">
                ←
              </span>


              <span class="page-nav-copy">

                <span class="page-nav-label">
                  Previous
                </span>

                <span class="page-nav-title">
                  —
                </span>

              </span>

            </button>


            <button
              type="button"
              class="page-nav-button next-page"
              disabled
            >

              <span class="page-nav-copy">

                <span class="page-nav-label">
                  Next
                </span>

                <span class="page-nav-title">
                  —
                </span>

              </span>


              <span class="page-nav-arrow">
                →
              </span>

            </button>

          </nav>


          <!-- =================================================
               THEME BUTTON
               ================================================= -->

          <button
            id="theme-button"
            type="button"
            aria-label="Switch to dark theme"
            title="Switch to dark theme"
          >
            ☾
          </button>

        </header>


        <!-- =================================================
             NOTE CONTENT

             app.js dynamically loads Markdown here.
             ================================================= -->

        <article
          id="content"
          aria-live="polite"
        >

          <div class="loading">

            <div class="loading-line"></div>

            <div class="loading-line short"></div>

            <div class="loading-line"></div>

          </div>

        </article>


      </main>


    </div>


    <!-- =====================================================
         NOTES TOGGLE

         The sidebar is visible initially and automatically
         collapses after 2.5 seconds.

         This button allows the user to open it again.
         ===================================================== -->

    <button
      id="notes-toggle"
      type="button"
      aria-label="Open notes list"
      title="Open notes list"
    >
      ☰ Notes
    </button>


  </div>


  <!-- =======================================================
       APPLICATION SCRIPT
       ======================================================= -->

  <script
    src="app.js"
    defer
  ></script>

</body>
</html>
