<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Xi Notes — personal notes and knowledge."
  >

  <meta
    name="theme-color"
    content="#09090b"
  >

  <title>Xi Notes</title>

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Markdown parser -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>

</head>


<body>

  <div class="app">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <!-- SIDEBAR HEADER -->

      <div class="sidebar-header">

        <a
          href="#"
          class="logo"
          onclick="
            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });
            return false;
          "
        >
          Xi Notes
        </a>

        <button
          id="close-sidebar"
          class="close-sidebar"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>


      <!-- SEARCH -->

      <div class="search-container">

        <div class="search-box">

          <span
            class="search-icon"
            aria-hidden="true"
          >
            /
          </span>

          <input
            id="search"
            type="search"
            placeholder="Search notes"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search notes"
          >

          <span
            class="search-shortcut"
            aria-hidden="true"
          >
            ⌘K
          </span>

        </div>

      </div>


      <!-- =====================================
           TOPIC LIST

           app.js automatically reads the
           Markdown files from /notes and
           inserts the topics here.
      ====================================== -->

      <nav
        class="topic-navigation"
        aria-label="Notes"
      >

        <!-- Topics are inserted by app.js -->

      </nav>


      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">

        <span>
          Personal notes
        </span>

      </div>

    </aside>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main">


      <!-- TOP BAR -->

      <header class="topbar">


        <!-- MOBILE MENU -->

        <button
          id="menu-button"
          class="menu-button"
          type="button"
          aria-label="Open menu"
          aria-controls="sidebar"
        >
          ☰
        </button>


        <!-- BREADCRUMB -->

        <div
          class="breadcrumb"
          aria-label="Breadcrumb"
        >

          <span class="breadcrumb-home">
            Xi Notes
          </span>

          <span
            class="breadcrumb-separator"
            aria-hidden="true"
          >
            /
          </span>

          <span
            id="current-topic"
            class="current-topic"
          >
            Notes
          </span>

        </div>


        <!-- THEME TOGGLE -->

        <button
          id="theme-button"
          class="theme-button"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          ☾
        </button>

      </header>


      <!-- =====================================
           NOTE CONTENT

           Markdown files are rendered here
           by app.js.
      ====================================== -->

      <div class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <!-- Initial page before a note loads -->

          <div class="welcome">

            <p class="welcome-label">
              NOTES
            </p>

            <h1>
              Xi Notes
            </h1>

            <p class="welcome-description">
              A collection of notes, ideas,
              concepts and things worth remembering.
            </p>

          </div>

        </article>

      </div>

    </main>

  </div>


  <!-- =====================================
       MOBILE OVERLAY
  ====================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================
       APPLICATION
  ====================================== -->

  <script src="app.js"></script>


  <!-- =====================================
       THEME
  ====================================== -->

  <script>

    const themeButton =
      document.getElementById(
        "theme-button"
      );


    /*
      Update the theme button icon.
    */

    function updateThemeIcon() {

      const isLight =
        document.body.classList.contains(
          "light-theme"
        );


      themeButton.textContent =
        isLight
          ? "☾"
          : "☀";


      themeButton.setAttribute(
        "aria-label",
        isLight
          ? "Switch to dark mode"
          : "Switch to light mode"
      );


      themeButton.setAttribute(
        "title",
        isLight
          ? "Switch to dark mode"
          : "Switch to light mode"
      );

    }


    /*
      Load saved theme.
    */

    const savedTheme =
      localStorage.getItem(
        "xi-notes-theme"
      );


    if (savedTheme === "light") {

      document.body.classList.add(
        "light-theme"
      );

    }


    /*
      Set initial icon.
    */

    updateThemeIcon();


    /*
      Toggle theme.
    */

    themeButton.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "light-theme"
        );


        const isLight =
          document.body.classList.contains(
            "light-theme"
          );


        localStorage.setItem(
          "xi-notes-theme",
          isLight
            ? "light"
            : "dark"
        );


        updateThemeIcon();

      }
    );

  </script>


</body>

</html>
