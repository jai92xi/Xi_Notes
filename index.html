<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — practical notes and concepts worth sharing."
  >

  <title>🧠 AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       MOBILE / TOP HEADER
       ===================================================== -->

  <header class="mobile-header">

    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        ☰
      </button>

    </div>


    <!-- ===================================================
         DAILY REVISION PROGRESS
         
         This is intentionally OUTSIDE the Contents sidebar.
         
         It is visible only when 1CheatSheet.md is open.
         
         JavaScript controls:
           0/0 completed
           1/8 completed
           2/8 completed
           etc.
         =================================================== -->

    <div
      id="revision-progress"
      class="revision-progress"
      aria-live="polite"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         MOBILE HEADER SPACER
         =================================================== -->

    <div
      class="header-spacer"
      aria-hidden="true"
    ></div>

  </header>


  <!-- =====================================================
       SIDEBAR OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       SIDEBAR / CONTENTS
       ===================================================== -->

  <aside
    id="sidebar"
    class="sidebar"
    aria-label="Contents"
  >


    <!-- ===================================================
         CONTENTS HEADER
         Search + Hide/Show
         
         IMPORTANT:
         No completion counter here.
         =================================================== -->

    <div
      id="sidebar-header"
      class="sidebar-header"
    >

      <div class="contents-search-box">

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="⌕ Search concepts..."
          autocomplete="off"
          aria-label="Search concepts"
        >


        <button
          id="contents-toggle"
          class="contents-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Hide contents"
          title="Hide contents"
        >

          <span></span>
          <span></span>
          <span></span>

        </button>

      </div>

    </div>


    <!-- ===================================================
         TOPICS / CONCEPTS INDEX
         =================================================== -->

    <nav
      id="topic-navigation"
      class="topic-navigation"
      aria-label="AI and ML concepts"
    >

      <div class="no-results">
        Loading concepts...
      </div>

    </nav>


    <!-- ===================================================
         SIDEBAR FOOTER
         =================================================== -->

    <div class="sidebar-footer">

      <span>Made with</span>

      <span class="footer-love">♥</span>

      <span>&amp; curiosity</span>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main id="main">


    <!-- ===================================================
         PREVIOUS / NEXT NAVIGATION
         =================================================== -->

    <nav
      id="page-navigation"
      class="page-navigation"
      aria-label="Note navigation"
    >


      <!-- =================================================
           PREVIOUS
           ================================================= -->

      <button
        id="previous-button"
        class="page-nav-button previous-page"
        type="button"
        disabled
        aria-label="Previous note"
        title="Previous note"
      >

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          ←
        </span>


        <span
          id="previous-title"
          class="page-nav-title"
        >
          Start
        </span>

      </button>


      <!-- =================================================
           NEXT
           ================================================= -->

      <button
        id="next-button"
        class="page-nav-button next-page"
        type="button"
        disabled
        aria-label="Next note"
        title="Next note"
      >

        <span
          id="next-title"
          class="page-nav-title"
        >
          You're caught up ✦
        </span>


        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </button>

    </nav>


    <!-- ===================================================
         NOTE CONTENT
         =================================================== -->

    <div class="content-wrapper">

      <article
        id="content"
        class="content"
      >

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>

    </div>

  </main>


  <!-- =====================================================
       FLOATING THEME BUTTON
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >

    <span
      class="theme-icon"
      aria-hidden="true"
    >
      ☾
    </span>

  </button>


  <!-- =====================================================
       MARKED.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       APP.JS
       ===================================================== -->

  <script
    src="app.js"
  ></script>


</body>

</html>
