<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Xi Notes - Machine Learning, Deep Learning and Data Science notes"
  >

  <title>Xi Notes</title>

  <!-- Favicon -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E"
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Marked.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>

</head>


<body>

  <!-- ======================================
       MOBILE SIDEBAR OVERLAY
  ======================================= -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
  ></div>


  <!-- ======================================
       HEADER
  ======================================= -->

  <header class="site-header">

    <div class="header-left">

      <!-- Mobile menu button -->
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open navigation"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        ☰
      </button>


      <!-- Site title -->
      <a
        href="./"
        class="site-title"
        aria-label="Xi Notes home"
      >
        Xi Notes
      </a>

    </div>


    <!-- Search -->
    <div class="search-container">

      <input
        id="search"
        type="search"
        placeholder="Search notes..."
        autocomplete="off"
        aria-label="Search notes"
      >

      <span
        class="search-shortcut"
        aria-hidden="true"
      >
        Ctrl K
      </span>

    </div>

  </header>


  <!-- ======================================
       MAIN LAYOUT
  ======================================= -->

  <div class="app-layout">


    <!-- ====================================
         SIDEBAR
    ===================================== -->

    <aside
      id="sidebar"
      class="sidebar"
      aria-label="Notes navigation"
    >

      <!-- Sidebar header -->

      <div class="sidebar-header">

        <div class="sidebar-title">
          Notes
        </div>

        <button
          id="close-sidebar"
          class="close-sidebar"
          type="button"
          aria-label="Close navigation"
        >
          ×
        </button>

      </div>


      <!-- Current topic -->

      <div
        id="current-topic"
        class="current-topic"
      >
        Select a note
      </div>


      <!-- Topic navigation -->

      <nav
        class="topic-navigation"
        aria-label="Notes"
      >
        <!--
          app.js populates this area.
        -->
      </nav>

    </aside>


    <!-- ====================================
         CONTENT
    ===================================== -->

    <main
      id="main-content"
      class="main-content"
    >

      <article
        id="content"
        class="content"
      >

        <!--
          app.js loads Markdown content here.

          The Previous / Next navigation is
          automatically inserted:

              1. At the top
              2. At the bottom
        -->

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>

    </main>

  </div>


  <!-- ======================================
       FOOTER
  ======================================= -->

  <footer class="site-footer">

    <span>
      Xi Notes
    </span>

  </footer>


  <!-- ======================================
       APP JAVASCRIPT
  ======================================= -->

  <script
    src="app.js"
  ></script>

</body>

</html>
