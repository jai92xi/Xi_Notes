<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xi Notes</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-header">

        <div class="logo">
          <span class="logo-icon">✦</span>
          <span>Xi Notes</span>
        </div>

        <button
          class="close-sidebar"
          id="close-sidebar"
          aria-label="Close sidebar"
        >
          ×
        </button>

      </div>


      <!-- SEARCH -->
      <div class="search-container">

        <div class="search-box">

          <span class="search-icon">⌕</span>

          <input
            type="text"
            id="search"
            placeholder="Search notes..."
            autocomplete="off"
          >

          <span class="search-shortcut">
            ⌘ K
          </span>

        </div>

      </div>


      <!-- NOTES NAVIGATION -->
      <nav
        class="topic-navigation"
        aria-label="Notes navigation"
      >
      </nav>


      <!-- SIDEBAR FOOTER -->
      <div class="sidebar-footer">
        <span>Xi Notes</span>
      </div>

    </aside>


    <!-- MAIN AREA -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <button
          class="menu-button"
          id="menu-button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <div class="breadcrumb">

          <span>Xi Notes</span>

          <span class="breadcrumb-arrow">
            /
          </span>

          <span id="current-topic">
            Notes
          </span>

        </div>


        <!-- THEME TOGGLE -->
        <button
          class="theme-button"
          id="theme-button"
          aria-label="Toggle dark and light mode"
          title="Toggle theme"
        >
          ☀
        </button>

      </header>


      <!-- CONTENT -->
      <section class="content-wrapper">

        <article
          id="content"
          class="content"
        >

          <div class="welcome">

            <div class="welcome-icon">
              ✦
            </div>

            <h1>
              Xi Notes
            </h1>

            <p>
              Pick a note from the sidebar and start exploring.
            </p>

          </div>

        </article>

      </section>

    </main>

  </div>


  <!-- MOBILE SIDEBAR OVERLAY -->
  <div
    class="sidebar-overlay"
    id="sidebar-overlay"
  ></div>


  <script src="app.js"></script>


  <script>

    /* ========================================
       THEME
    ======================================== */

    const themeButton =
      document.getElementById("theme-button");


    function updateThemeIcon() {

      const isLight =
        document.body.classList.contains(
          "light-theme"
        );

      themeButton.textContent =
        isLight ? "☾" : "☀";

      themeButton.setAttribute(
        "aria-label",
        isLight
          ? "Switch to dark mode"
          : "Switch to light mode"
      );
    }


    themeButton.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "light-theme"
        );

        const isLight =
          document.body.classList.contains(
            "light-theme"
          );

        localStorage.setItem(
          "xi-notes-theme",
          isLight
            ? "light"
            : "dark"
        );

        updateThemeIcon();
      }
    );


    /* ========================================
       LOAD SAVED THEME
    ======================================== */

    const savedTheme =
      localStorage.getItem(
        "xi-notes-theme"
      );


    if (savedTheme === "light") {

      document.body.classList.add(
        "light-theme"
      );

    }


    updateThemeIcon();


    /* ========================================
       MOBILE SIDEBAR
    ======================================== */

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const menuButton =
      document.getElementById(
        "menu-button"
      );

    const closeSidebar =
      document.getElementById(
        "close-sidebar"
      );

    const overlay =
      document.getElementById(
        "sidebar-overlay"
      );


    function openSidebar() {

      sidebar.classList.add(
        "mobile-open"
      );

      overlay.classList.add(
        "active"
      );

      document.body.classList.add(
        "sidebar-open"
      );
    }


    function closeSidebarMenu() {

      sidebar.classList.remove(
        "mobile-open"
      );

      overlay.classList.remove(
        "active"
      );

      document.body.classList.remove(
        "sidebar-open"
      );
    }


    menuButton.addEventListener(
      "click",
      openSidebar
    );


    closeSidebar.addEventListener(
      "click",
      closeSidebarMenu
    );


    overlay.addEventListener(
      "click",
      closeSidebarMenu
    );


    /* ========================================
       CLOSE MOBILE SIDEBAR AFTER NOTE CLICK
    ======================================== */

    document.addEventListener(
      "click",
      event => {

        if (
          event.target.classList.contains(
            "topic-button"
          )
        ) {

          closeSidebarMenu();

        }

      }
    );

  </script>

</body>
</html>
