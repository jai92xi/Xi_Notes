<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — practical notes and concepts worth sharing."
  >

  <title>AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       MOBILE HEADER
       ===================================================== -->

  <header class="mobile-header">

    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        aria-controls="sidebar"
        aria-expanded="false"
        title="Open contents"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- =====================================================
       SIDEBAR OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       SIDEBAR / CONTENTS
       ===================================================== -->

  <aside
    id="sidebar"
    class="sidebar"
    aria-label="Contents"
  >

    <!-- Contents toggle -->

    <button
      id="contents-toggle"
      class="contents-toggle"
      type="button"
      aria-expanded="true"
      aria-controls="topic-navigation"
      aria-label="Hide contents"
      title="Hide contents"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>


    <!-- Search -->

    <div
      id="sidebar-header"
      class="sidebar-header"
    >

      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="⌕  Search concepts..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Search concepts"
      >

    </div>


    <!-- Topics -->

    <nav
      id="topic-navigation"
      class="topic-navigation"
      aria-label="AI and ML concepts"
    >

      <div class="no-results">
        Loading concepts...
      </div>

    </nav>


    <!-- Footer -->

    <div class="sidebar-footer">

      <span>Made with</span>

      <span
        class="footer-love"
        aria-hidden="true"
      >
        ♥
      </span>

      <span>&amp; curiosity</span>

    </div>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main
    id="main"
    tabindex="-1"
  >

    <!-- ===================================================
         TOP PREVIOUS / NEXT NAVIGATION
         =================================================== -->

    <nav
      id="page-navigation"
      class="page-navigation"
      aria-label="Note navigation"
    >

      <!-- Previous -->

      <button
        id="previous-button"
        class="page-nav-button previous-page"
        type="button"
        disabled
        aria-disabled="true"
        aria-label="Previous note"
      >

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          ←
        </span>

        <span class="page-nav-copy">

          <span class="page-nav-label">
            Previous
          </span>

          <span
            id="previous-title"
            class="page-nav-title"
          >
            Start
          </span>

        </span>

      </button>


      <!-- Next -->

      <button
        id="next-button"
        class="page-nav-button next-page"
        type="button"
        disabled
        aria-disabled="true"
        aria-label="Next note"
      >

        <span class="page-nav-copy">

          <span class="page-nav-label">
            Next
          </span>

          <span
            id="next-title"
            class="page-nav-title"
          >
            You're caught up ✦
          </span>

        </span>

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </button>

    </nav>


    <!-- ===================================================
         NOTE CONTENT
         =================================================== -->

    <div class="content-wrapper">

      <article
        id="content"
        class="content"
        aria-live="polite"
        aria-busy="false"
      >

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>

    </div>

  </main>


  <!-- =====================================================
       FLOATING THEME BUTTON
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >
    ☾
  </button>


  <!-- =====================================================
       MARKED.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script
    src="app.js"
  ></script>

</body>
</html>
