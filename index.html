<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI & ML Key Concepts — practical notes and concepts worth sharing."
  >

  <title>AI & ML Key Concepts</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       MOBILE HEADER
       ===================================================== -->

  <header class="mobile-header">

    <div class="header-actions">

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open contents"
        title="Open contents"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- =====================================================
       SIDEBAR OVERLAY
       ===================================================== -->

  <div
    id="sidebar-overlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       SIDEBAR / CONTENTS
       ===================================================== -->

  <aside
    id="sidebar"
    class="sidebar"
    aria-label="Contents"
  >

    <!-- ===================================================
         CONTENTS HEADER
         Search + Hide/Show in one box
         =================================================== -->

    <div
      id="sidebar-header"
      class="sidebar-header"
    >

      <div class="contents-search-box">

        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="⌕  Search concepts..."
          autocomplete="off"
          aria-label="Search concepts"
        >

        <button
          id="contents-toggle"
          class="contents-toggle"
          type="button"
          aria-expanded="true"
          aria-label="Hide contents"
          title="Hide contents"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>

    </div>


    <!-- ===================================================
         TOPICS
         =================================================== -->

    <nav
      id="topic-navigation"
      class="topic-navigation"
      aria-label="AI and ML concepts"
    >

      <div class="no-results">
        Loading concepts...
      </div>

    </nav>


    <!-- ===================================================
         SIDEBAR FOOTER
         =================================================== -->

    <div class="sidebar-footer">
      <span>Made with</span>
      <span class="footer-love">♥</span>
      <span>&amp; curiosity</span>
    </div>

  </aside>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main id="main">


    <!-- ===================================================
         PREVIOUS / NEXT NAVIGATION
         =================================================== -->

    <nav
      id="page-navigation"
      class="page-navigation"
      aria-label="Note navigation"
    >

      <!-- Previous -->

      <button
        id="previous-button"
        class="page-nav-button previous-page"
        type="button"
        disabled
        aria-label="Previous note"
        title="Previous note"
      >

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          ←
        </span>

        <span
          id="previous-title"
          class="page-nav-title"
        >
          Start
        </span>

      </button>


      <!-- Next -->

      <button
        id="next-button"
        class="page-nav-button next-page"
        type="button"
        disabled
        aria-label="Next note"
        title="Next note"
      >

        <span
          id="next-title"
          class="page-nav-title"
        >
          You're caught up ✦
        </span>

        <span
          class="page-nav-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </button>

    </nav>


    <!-- ===================================================
         NOTE CONTENT
         =================================================== -->

    <div class="content-wrapper">

      <article
        id="content"
        class="content"
      >

        <div class="loading">

          <div class="loading-line"></div>

          <div class="loading-line short"></div>

          <div class="loading-line"></div>

        </div>

      </article>

    </div>

  </main>


  <!-- =====================================================
       FLOATING THEME BUTTON
       ===================================================== -->

  <button
    id="theme-button"
    class="theme-button"
    type="button"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >
    ☾
  </button>


  <!-- =====================================================
       MARKED.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script
    src="app.js"
  ></script>

</body>
</html>
