<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Xi Notes | Technical Interview Revision</title>

  <meta
    name="description"
    content="A focused technical interview revision workspace for AI, ML, data engineering, formulas, concepts, and interview preparation."
  />

  <meta name="theme-color" content="#f5f7fb" />

  <link rel="icon" href="./favicon.ico" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./style.css" />

  <!-- KaTeX styles for mathematical formulas -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  />

  <!-- Highlight.js styles for code blocks -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
  />

  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fb;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.22);
      outline-offset: 2px;
    }

    a {
      color: #4f46e5;
    }

    ::selection {
      color: #1e1b4b;
      background: #e0e7ff;
    }

    #app {
      min-height: 100vh;
    }

    .noscript {
      max-width: 700px;
      margin: 64px auto;
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <noscript>
      <div class="noscript">
        <h1>Xi Notes</h1>
        <p>
          JavaScript is required to load your technical interview notes.
          Enable JavaScript and refresh this page.
        </p>
      </div>
    </noscript>
  </div>

  <!-- Application script -->
  <script src="./app.js" defer></script>
</body>
</html>
